<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- A mesma estrela da abertura do site, girando e brilhando.
       O giro acontece em volta do centro exato do ícone (50, 50). -->
  <defs>
    <radialGradient id="brilho" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffe58a" stop-opacity="0.75"/>
      <stop offset="45%" stop-color="#d4af37" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#d4af37" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="100" height="100" rx="22" fill="#0f172a"/>
  <circle cx="50" cy="50" r="44" fill="url(#brilho)">
    <animate attributeName="opacity" values="0.45;1;0.45" dur="2.4s" repeatCount="indefinite"/>
  </circle>
  <g>
    <animateTransform attributeName="transform" type="rotate" values="0 50 50;360 50 50" dur="10s" repeatCount="indefinite"/>
    <g transform="translate(8 8) scale(0.84)">
      <path d="M50 0 C52 35 65 48 100 50 C65 52 52 65 50 100 C48 65 35 52 0 50 C35 48 48 35 50 0 Z" fill="#d4af37"/>
      <path d="M50 15 C52 38 62 48 85 50 C62 52 52 62 50 85 C48 62 38 52 15 50 C38 48 48 38 50 15 Z" fill="#fff3c4" opacity="0.7" transform="rotate(45 50 50)">
        <animate attributeName="opacity" values="0.45;1;0.45" dur="2.2s" repeatCount="indefinite"/>
      </path>
    </g>
  </g>
</svg>
